<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>

<body>

    <!--Header cabecera del body-->

    <header>
        <h1>FORMULARIO</h1>
    </header>

    <!--Formulario-->
    <div>
        <form action="../index.html" method="post">
            <div>
                <!--Label permite ingresar texto fijo-->
                <label for="nombre">Ingrese el nombre</label>
                <!--Input una caja para ingresar texto-->
                <input type="text" id="nombre">

                <div>
                    <br>
                    <label for="edad">Edad</label>
                    <!--Input de tipo numerico-->
                    <input type="number" max="100" min="0" id="edad">
                </div>


                <div>
                    <br>
                    <label for="email">Correo Electronico</label>
                    <!--Input de tipo email-->
                    <input type="email" name="" id="email">
                </div>


                <div>
                    <br>
                    <label for="direccion">Direccion</label>
                    <input type="text" name="" id="direccion">
                </div>

                <div>
                    <br>
                    <!--Botom submit permite enviar informacion-->
                    <input type="submit" name="" id="">
                </div>


                <label for="">pene</label>
                <input type="radio">
                <label for="">cuca</label>
                <input type="radio">

                <br>
                <label for="">archivos</label>
                <input type="file" name="" id="">

            </div>

            <label for=""></label>
            <select>
                <option value="manzana">manzana</option>
                <option value="naranja">naranjas</option>
            </select>

            <br>
            <label for="comentario">Escribe tu comentario:</label>
            <textarea id="comentario" name="comentario" rows="4" cols="50"></textarea>
        </form>
    </div>

    <div>
        <br>
        <a href="../index.html">Regresar al index</a>
    </div>


</body>

</html>
